name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - "vcpkg.json"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '6c2e6c3a5e8d7c1d6d7b6a4b7f0e2f6b4a8d3a7b'

      - name: Install dependencies
        shell: pwsh
        run: |
          .\vcpkg\vcpkg.exe install --triplet x64-windows-static

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "$env:GITHUB_WORKSPACE\build\Release\HEICConverter.exe"
          if (!(Test-Path $exe)) {
            throw "HEICConverter.exe was not produced."
          }
          $size = (Get-Item $exe).Length
          if ($size -lt 100000) {
            throw "Executable is unexpectedly small: $size bytes"
          }
          Write-Host "Built: $exe"
          Write-Host "Size: $size bytes"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build\Release\HEICConverter.exe" "dist\HEICConverter.exe"
          Compress-Archive -Path "dist\HEICConverter.exe" -DestinationPath "HEICConverter-win-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HEICConverter-win-x64
          path: HEICConverter-win-x64.zip
          if-no-files-found: error
          
